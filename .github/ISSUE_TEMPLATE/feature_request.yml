name: Feature request
description: Propose a change or a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like to happen. For a new ADE, say which CLI operations it offers.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Effect on sends and access
      description: Does this change when work is sent to an agent, how deliveries are confirmed, or who can reach the server? Say "none" if not.
