[project]
name = "ade-call-checks"
version = "0.1.0"
description = "Development checks (Ruff) for ADE Call; not a Python package."
requires-python = ">=3.13"
dependencies = []

[tool.uv]
package = false
required-version = "==0.12.1"

[dependency-groups]
dev = ["ruff==0.15.7"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
